services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: labmanager
      POSTGRES_USER: labmanager_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres_data:
