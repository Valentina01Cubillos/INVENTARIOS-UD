<div class="pagination"><span>{{ page.paginator.count }} registros · Página {{ page.number }} de {{ page.paginator.num_pages }}</span><div class="actions">{% if page.has_previous %}<a href="?{{ querystring }}page={{ page.previous_page_number }}">Anterior</a>{% endif %}{% if page.has_next %}<a href="?{{ querystring }}page={{ page.next_page_number }}">Siguiente</a>{% endif %}</div></div>
